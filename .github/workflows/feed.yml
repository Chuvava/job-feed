name: job-feed

on:
  schedule:
    # every 30 min, ~07:00-23:40 Warsaw; off :00/:30 because GitHub drops many top-of-hour runs
    - cron: "7,37 5-21 * * *"
  workflow_dispatch:
    inputs:
      backlog:
        description: "Send every matching offer currently online (digest), not only new ones"
        type: boolean
        default: false

concurrency:
  group: job-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect and notify
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # optional: marks offers already in the tracker sheet (📌); without them the feed works as before
          SHEET_URL: ${{ secrets.SHEET_URL }}
          SHEET_SECRET: ${{ secrets.SHEET_SECRET }}
        run: python -m jobfeed.main ${{ inputs.backlog && '--backlog' || '' }}

      - name: Save seen state
        run: |
          git config user.name "job-feed-bot"
          git config user.email "job-feed-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "state: update seen jobs" -q
          git push -q
