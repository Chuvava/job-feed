name: job-feed

on:
  schedule:
    - cron: "*/30 5-21 * * *"   # every 30 min, 07:00-23:30 Warsaw (UTC+2 summer)
  workflow_dispatch: {}

concurrency:
  group: job-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect and notify
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m jobfeed.main

      - name: Save seen state
        run: |
          git config user.name "job-feed-bot"
          git config user.email "job-feed-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "state: update seen jobs" -q
          git push -q
