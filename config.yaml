# What to collect and what to let through to Telegram.
# Matching is case-insensitive substring matching on the job title.

filters:
  # A title must contain at least one of these
  title_include:
    - automat        # automation, automatyzacji, automated
    - aqa
    - sdet
    - qa engineer
    - test engineer
    - quality assurance
    - quality engineer
    - tester
    - testing engineer
    - playwright
    - selenium
  # A title containing any of these is dropped
  title_exclude:
    - manual
    - manualny
    - junior
    - intern
    - trainee
    - staż
    - praktyk
    - student
    - penetration
    - pentest
  # Seniority levels to drop (JustJoin experienceLevel / NoFluff seniority, lowercase)
  seniority_exclude:
    - junior
    - trainee
    - intern
  # Per workplace type: "any" location, or a list of cities (diacritics/English names both fine).
  # A type that is not listed here is rejected.
  workplace:
    remote: any
    hybrid: [Łódź, Warszawa, Warsaw, Kraków, Cracow]
    office: [Łódź]

sources:
  justjoin:
    enabled: true
    category: testing
    max_pages: 5          # 10 offers per page, newest first
    backlog:              # overrides for --backlog (everything currently online)
      max_pages: 40

  nofluff:
    enabled: true
    category: testing

  linkedin:
    enabled: true
    location: Poland
    hours_old: 3           # only postings from the last N hours
    results_per_term: 40
    delay_seconds: 15      # pause between search terms, LinkedIn answers 429 otherwise
    backlog:
      hours_old: 168       # last week
      results_per_term: 100
    search_terms:
      - QA Automation Engineer
      - SDET
      - Test Automation Engineer
      - Playwright

# Delivery priority (jobfeed/rank.py): 🔥 card right away only for Java/C# + remote or light hybrid
# + rate ≥ min_rate (or not stated); everything else waits for the evening digest.
priority:
  min_rate: 120          # PLN/h B2B; monthly /168, daily /8, EUR ×4.25
  low_rate: 100          # below this → low priority
  light_hybrid_days: 6   # office days per month that still count as "almost remote"
  digest_hour: 20        # Europe/Warsaw, first hourly run at or after it sends the digest
  digest_cards: 10       # top N of the digest as cards with buttons
