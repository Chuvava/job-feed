# What to collect and what to let through to Telegram.
# Matching is case-insensitive substring matching on the job title.

filters:
  # A title must contain at least one of these
  title_include:
    - automat        # automation, automatyzacji, automated
    - aqa
    - sdet
    - qa engineer
    - test engineer
    - quality assurance
    - quality engineer
    - tester
    - testing engineer
    - playwright
    - selenium
  # A title containing any of these is dropped
  title_exclude:
    - manual
    - manualny
    - junior
    - intern
    - trainee
    - staż
    - praktyk
    - student
    - penetration
    - pentest
  # Seniority levels to drop (JustJoin experienceLevel / NoFluff seniority, lowercase)
  seniority_exclude:
    - junior
    - trainee
    - intern
  # Per workplace type: "any" location, or a list of cities (diacritics/English names both fine).
  # A type that is not listed here is rejected.
  workplace:
    remote: any
    hybrid: [Łódź, Warszawa, Warsaw, Kraków, Cracow]
    office: [Łódź]

sources:
  justjoin:
    enabled: true
    category: testing
    max_pages: 15   # top pages are full of "bumped" old offers (publishedAt = refresh time); new ones sit lower          # 10 offers per page, newest first
    backlog:              # overrides for --backlog (everything currently online)
      max_pages: 40

  nofluff:
    enabled: true
    category: testing

  linkedin:
    enabled: true
    location: Poland
    hours_old: 3           # only postings from the last N hours
    results_per_term: 40
    delay_seconds: 15      # pause between search terms, LinkedIn answers 429 otherwise
    backlog:
      hours_old: 168       # last week
      results_per_term: 100
    search_terms:
      - QA Automation Engineer
      - SDET
      - Test Automation Engineer
      - Playwright

# Delivery (jobfeed/rank.py + digest.py): offers are collected hourly but never sent right away.
# At each batch hour the best `batch_cards` waiting offers go out as cards; at digest_hour the
# day summary lists everything else (low priority at the bottom). Hours are Europe/Warsaw.
priority:
  min_rate: 120          # PLN/h B2B; monthly /168, daily /8, EUR ×4.25; not stated counts as OK
  low_rate: 100          # below this → low priority, never a card
  light_hybrid_days: 4   # office days per month that still count as "almost remote"
  batch_hours: [9, 12, 15, 18, 21]
  batch_cards: 3
  digest_hour: 21        # right after the last batch
